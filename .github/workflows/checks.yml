# Reusable checks. Called by ci.yml (pull requests) and release.yml (push to main).
#   full: false  -> fast lane: lint, Linux gcc, Windows MinGW
#   full: true   -> fast lane + sanitizers, static analysis, script tests, MSVC check, headless smoke runs
name: Checks

on:
  workflow_call:
    inputs:
      full:
        description: "Run the full lane as well"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "18.1.8"
  LINUX_DEPS: ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxext-dev

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/fmt"
          "$RUNNER_TEMP/fmt/bin/pip" install --quiet "clang-format==${CLANG_FORMAT_VERSION}"
          echo "$RUNNER_TEMP/fmt/bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: bash tools/format.sh --check
      - name: Repository rules (game contract, portability, AGENTS.md)
        run: bash tools/check_repo.sh

  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Logic-only build + unit tests (fast, no download)
        run: |
          cmake --preset logic
          cmake --build --preset logic
          ctest --preset logic
      - name: Full build (raylib + hub, warnings are errors)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Hub starts and every game is registered (no window needed)
        run: |
          build/dev/bin/arcade-hub --version
          build/dev/bin/arcade-hub --list
          expected="$(find games -mindepth 1 -maxdepth 1 -type d ! -name '_*' | wc -l)"
          build/dev/bin/arcade-hub --list | tail -n 1 | grep -qx "${expected} game(s)"

  windows-mingw:
    name: windows-mingw
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Logic-only build + unit tests
        run: |
          cmake --preset logic
          cmake --build --preset logic
          ctest --preset logic
      - name: Full build (raylib + hub)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Hub starts and every game is registered (no window needed)
        run: |
          build/dev/bin/arcade-hub.exe --version
          build/dev/bin/arcade-hub.exe --list

  # ---------------------------------------------------------------- full lane
  sanitizers:
    name: sanitizers (clang)
    if: inputs.full
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: ASan + UBSan unit tests (logic only)
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan

  static-analysis:
    name: static-analysis (cppcheck)
    if: inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck
      - name: Analyse the pure-C code (core, game logic, tests)
        run: |
          cppcheck --version
          # raylib-based files (*_game.c, core/gfx, app/) are covered by the compiler's -Wall -Wextra -Werror instead:
          # cppcheck cannot parse raylib's compound-literal colour macros.
          find core/src core/include games tests -type f \( -name '*.c' -o -name '*.h' \) ! -name '*_game.c' ! -name 'gfx.h' ! -path 'games/_template/*' | sort > cppcheck-files.txt
          cppcheck --std=c99 --enable=warning,portability --inline-suppr --error-exitcode=1 -q \
            --suppress=missingIncludeSystem -I core/include --file-list=cppcheck-files.txt

  scripts:
    name: scripts (version bump + add-a-game)
    if: inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: next_version.sh
        run: bash tools/tests/test_next_version.sh
      - name: Scaffold a new game, build it, test it
        run: bash tools/tests/test_new_game.sh

  windows-msvc:
    name: windows-msvc (compile check)
    if: inputs.full
    # Not blocking yet: flip this to false after the first fully green run.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build + test with MSVC (warnings are not errors yet)
        shell: bash
        run: |
          cmake -S . -B build/msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl
          cmake --build build/msvc
          ctest --test-dir build/msvc --output-on-failure
          build/msvc/bin/arcade-hub.exe --version

  smoke:
    name: smoke (headless, ${{ matrix.os }})
    if: inputs.full
    # raylib's software renderer is new: non-blocking until it has proven stable on both OSes.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Headless build + smoke run of every game (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset headless
          cmake --build --preset headless
          build/headless/bin/arcade-hub --smoke all --frames 600 --out smoke-out
      - name: Headless build + smoke run of every game (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --preset headless
          cmake --build --preset headless
          build/headless/bin/arcade-hub.exe --smoke all --frames 600 --out smoke-out
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-screenshots-${{ runner.os }}
          path: smoke-out/*.png
          if-no-files-found: warn
          retention-days: 7
