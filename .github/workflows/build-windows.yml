# On-demand Windows build (one executable: assets/ is compiled into it). Trigger manually from any branch via
# Actions -> Build Windows -> Run workflow.
# The workflow file must live on the default branch (main) for GitHub to list it,
# but you pick the target branch in the "Use workflow from" dropdown.
name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build (static)
        run: |
          cmake --preset release -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Package (one executable, nothing else)
        run: |
          sha="$(git rev-parse --short HEAD)"
          mkdir -p dist
          cp build/release/bin/arCade.exe "dist/arCade-${sha}-windows-x86_64.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
