# On-demand Windows build. Trigger manually from any branch via Actions -> Build Windows -> Run workflow.
# The workflow file must live on the default branch (main) for GitHub to list it,
# but you pick the target branch in the "Use workflow from" dropdown.
name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build (static)
        run: |
          cmake --preset release -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Package
        run: |
          sha="$(git rev-parse --short HEAD)"
          name="arCade-${sha}-windows-x86_64"
          mkdir -p "dist/$name"
          cp build/release/bin/arCade.exe "dist/$name/"
          cp -r assets "dist/$name/assets"
          cp LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          [ -f packaging/PLAY.txt ] && cp packaging/PLAY.txt "dist/$name/README.txt"
          (cd dist && zip -qr "$name.zip" "$name")
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
