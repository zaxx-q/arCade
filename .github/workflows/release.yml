# Every push to main that passes the FULL checks becomes a GitHub Release (Linux + Windows + Android downloads).
# Linux and Windows are ONE executable each (no zip, no tar): assets/ and the license texts are compiled into it.
# Android is one signed .apk (android.yml, signed with the release key from the repository secrets).
# Manual run: Actions -> Release -> Run workflow (choose bump, prerelease, dry run).
# Versions come from git tags + Conventional Commits (tools/next_version.sh). This workflow NEVER commits.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = decide from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      dry_run:
        description: "Build everything but do not create the release"
        type: boolean
        default: false

# One release at a time. A newer push waits (and replaces older waiting runs: their commits are
# included in the newer release anyway).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      full: true

  version:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      previous_tag: ${{ steps.v.outputs.previous_tag }}
      bump: ${{ steps.v.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history are needed
      - id: v
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: bash tools/next_version.sh --bump "$BUMP" | tee -a "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    if: needs.version.outputs.skip != 'true'
    # Oldest Ubuntu runner still offered: binaries built on older glibc run on more distributions.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxext-dev
      - name: Build, test, check version
        run: |
          # The Online leaderboard ships in every release. libcurl is built from source and linked statically
          # (cmake/ArcadeCurl.cmake, with the static OpenSSL of libssl-dev), so the game needs no libcurl when it
          # runs. ON makes a missing dependency fail this build, instead of a release without the Online tab.
          cmake --preset release -DARCADE_VERSION="$VERSION" -DARCADE_ONLINE=ON -DARCADE_ONLINE_BUNDLE_CURL=ON
          cmake --build --preset release
          ctest --preset release
          strip build/release/bin/arCade
          vout="$(build/release/bin/arCade --version)"
          printf '%s\n' "$vout"
          printf '%s\n' "$vout" | grep -q "arCade $VERSION "
      - name: Check that the Online leaderboard is built in and needs no libcurl or OpenSSL
        run: |
          # net_curl.c is only linked in when libcurl was found: its message is in the binary
          grep -aq 'online: refusing the server address' build/release/bin/arCade
          deps="$(ldd build/release/bin/arCade)"
          printf '%s\n' "$deps"
          if printf '%s\n' "$deps" | grep -Eq 'libcurl|libssl|libcrypto'; then
            echo "::error::arCade needs libcurl or OpenSSL at run time: libcurl was not linked statically"
            exit 1
          fi
      - name: Package (one executable, nothing else)
        run: |
          mkdir -p dist
          cp build/release/bin/arCade "dist/arCade-v${VERSION}-linux-x86_64"
          # on its own in an empty folder: the license texts come out of the executable itself
          mkdir standalone
          cp build/release/bin/arCade standalone/
          (cd standalone && ./arCade --licenses > licenses.txt && grep -q "MIT License" licenses.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/arCade-v*-linux-x86_64
          if-no-files-found: error

  build-windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build (static, no extra DLLs needed), test, check version
        run: |
          # The Online leaderboard ships in every release: libcurl is built from source and linked statically,
          # with Schannel (the TLS of Windows) instead of OpenSSL (cmake/ArcadeCurl.cmake). ON makes a missing
          # dependency fail this build, instead of a release without the Online tab.
          cmake --preset release -DARCADE_VERSION="$VERSION" -DCMAKE_EXE_LINKER_FLAGS="-static" -DARCADE_ONLINE=ON -DARCADE_ONLINE_BUNDLE_CURL=ON
          cmake --build --preset release
          ctest --preset release
          vout="$(build/release/bin/arCade.exe --version)"
          printf '%s\n' "$vout"
          printf '%s\n' "$vout" | grep -q "arCade $VERSION "
      - name: Check that the Online leaderboard is built in and needs no extra DLLs
        run: |
          grep -aq 'online: refusing the server address' build/release/bin/arCade.exe
          deps="$(objdump -p build/release/bin/arCade.exe | grep 'DLL Name')"
          printf '%s\n' "$deps"
          # Windows' own DLLs (KERNEL32, WS2_32, CRYPT32, ...) are fine. A lib*.dll or zlib*.dll comes from
          # MSYS2 and would not exist on the player's computer.
          if printf '%s\n' "$deps" | grep -Eiq 'DLL Name: (lib|zlib)'; then
            echo "::error::arCade.exe imports a DLL that is not part of Windows: libcurl was not linked statically"
            exit 1
          fi
      - name: Package (one executable, nothing else)
        run: |
          mkdir -p dist
          cp build/release/bin/arCade.exe "dist/arCade-v${VERSION}-windows-x86_64.exe"
          # on its own in an empty folder: the license texts come out of the executable itself
          mkdir standalone
          cp build/release/bin/arCade.exe standalone/
          (cd standalone && ./arCade.exe --licenses > licenses.txt && grep -q "MIT License" licenses.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: dist/arCade-v*-windows-x86_64.exe
          if-no-files-found: error

  build-android:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release: true
    # Named one by one on purpose (never `secrets: inherit`): these four are the only secrets the build can see.
    secrets:
      ARCADE_KEYSTORE_B64: ${{ secrets.ARCADE_KEYSTORE_B64 }}
      ARCADE_KEYSTORE_PASSWORD: ${{ secrets.ARCADE_KEYSTORE_PASSWORD }}
      ARCADE_KEY_ALIAS: ${{ secrets.ARCADE_KEY_ALIAS }}
      ARCADE_KEY_PASSWORD: ${{ secrets.ARCADE_KEY_PASSWORD }}

  publish:
    needs: [version, build-linux, build-windows, build-android]
    # The Android build is not required yet: until a release has gone through with it (docs/ANDROID.md), a failed
    # Android job (a missing key, an NDK problem) still lets Linux and Windows publish, without the .apk, and says so.
    # To make it required, delete this `if:` (then every job in `needs` must succeed).
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PREV_TAG: ${{ needs.version.outputs.previous_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      ANDROID_RESULT: ${{ needs.build-android.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Say so when there is no Android .apk
        if: needs.build-android.result != 'success'
        run: |
          echo "::warning::build-android finished with '$ANDROID_RESULT': this release has no Android .apk (see that job's log)"
          echo "### No Android .apk in this release (build-android: $ANDROID_RESULT)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt
      - name: Create the release
        run: |
          notes_file="${RUNNER_TEMP}/RELEASE_NOTES.md"
          api_notes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            ${PREV_TAG:+ -f previous_tag_name="$PREV_TAG"} 2>/dev/null | jq -r '.body // empty' || true)"

          if printf '%s' "$api_notes" | grep -q "## What's Changed"; then
            printf '%s\n' "$api_notes" > "$notes_file"
          else
            range="$GITHUB_SHA"
            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "none" ]; then
              range="$PREV_TAG..$GITHUB_SHA"
            fi
            commit_notes="$(git log --no-merges --format='* %s (%h)' "$range" || true)"
            compare_url="https://github.com/$GITHUB_REPOSITORY/compare/${PREV_TAG:-HEAD}...$TAG"
            {
              echo "## What's Changed"
              printf '%s\n\n' "$commit_notes"
              echo "**Full Changelog**: $compare_url"
            } > "$notes_file"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would publish $TAG with notes:"; cat "$notes_file"
            ls -l dist
            echo "### Dry run for $TAG (nothing published)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "arCade $TAG" --notes-file "$notes_file")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/*
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
